<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SwasthyaSetu</title><link rel="stylesheet" href="assets/styles.css"></head><body><script src="assets/shared.js"></script><script src="assets/api.js"></script><script>ssPage('facility-finder.html', `<div class="page-head"><div><h1 data-en="Find Public Healthcare Facility" data-hi="सार्वजनिक स्वास्थ्य सुविधा खोजें">Find Public Healthcare Facility</h1><p data-en="Compare capability, distance and available services" data-hi="क्षमता, दूरी और उपलब्ध सेवाओं की तुलना करें">Compare capability, distance and available services</p></div><span class="badge">● <span data-en="Live Demo" data-hi="लाइव डेमो">Live Demo</span></span></div><div class="panel panel-pad"><div class="form-grid"><div class="field"><label data-en="Facility type" data-hi="सुविधा प्रकार">Facility type</label><select id="typeFilter"><option value="">All facilities / सभी</option><option>PHC</option><option>CHC</option><option>District Hospital</option></select></div><div class="field"><label data-en="Service keyword" data-hi="सेवा कीवर्ड">Service keyword</label><input id="serviceFilter" placeholder="Emergency, ANC, ICU..."></div><div class="field full"><button class="btn" id="facilitySearch" data-en="Search facilities" data-hi="सुविधाएं खोजें">Search facilities</button></div></div></div><div class="panel" style="margin-top:18px"><div class="panel-head"><h3 data-en="Network facilities" data-hi="नेटवर्क सुविधाएं">Network facilities</h3><span class="badge" data-en="Check timestamp before referral" data-hi="रेफरल से पहले समय जांचें">Check timestamp before referral</span></div><div id="facilityTable" class="table-wrap"></div></div>`);</script><script>async function loadFacilities(){let q=new URLSearchParams();if(typeFilter.value)q.set('type',typeFilter.value);if(serviceFilter.value)q.set('service',serviceFilter.value);const fs=await SS_API.get('/facilities?'+q);facilityTable.innerHTML=`<table class="table"><thead><tr><th>Facility</th><th>Type</th><th>Distance</th><th>Doctors</th><th>Beds</th><th>Last updated</th></tr></thead><tbody>${fs.map(f=>`<tr><td><b>${ssEsc(f.name)}</b><br><small>${f.services.map(ssEsc).join(', ')}</small></td><td>${ssEsc(f.type)}</td><td>${f.distanceKm} km</td><td>${f.doctors}</td><td>${f.beds}</td><td>${new Date(f.lastUpdated).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="6">No matching facility found.</td></tr>'}</tbody></table>`}facilitySearch.onclick=()=>loadFacilities().catch(e=>ssToast(e.message));loadFacilities().catch(e=>ssToast('Backend not available'))</script></body></html>
