<section class="panel" style="margin-top:18px"><div class="panel-head"><h3 data-en="Governance actions" data-hi="शासन संबंधी कार्य">Governance actions</h3></div><div class="panel-pad"><div class="quick-grid"><a class="quick red" href="emergency-network/alerts.html"><span>🚨</span><span>Emergency alerts</span></a><a class="quick" href="facility-dashboard.html"><span>▥</span><span>Facility capacity</span></a><a class="quick green" href="referral.html"><span>↗</span><span>Referral audit</span></a><a class="quick purple" href="asha-dashboard.html"><span>♟</span><span>Frontline follow-up</span></a><a class="quick" href="medicine-diagnostics.html"><span>⚕</span><span>Medicine & labs</span></a><a class="quick" href="schemes.html"><span>▣</span><span>Public schemes</span></a></div></div></section>

<script>
const flow=[['Patients assessed','1,248','green'],['Referred','318','blue'],['Reached receiving facility','276','green'],['Treatment completed','241','purple']];

const fac=[['PHC cluster A','ICU 2 free','Diagnostics limited'],['Rural Hospital B','Beds 18 free','Medicines OK'],['District Hospital C','ICU 4 free','High queue'],['CHC cluster D','Beds 11 free','Diagnostics OK']];

const alerts=[['High-risk follow-up','23 maternal/child cases due today','high'],['Referral delay','9 urgent referrals > 2 hours','medium'],['Diagnostic gap','4 facilities reporting test unavailability','medium'],['Connectivity','7 facilities in sync-delay queue','low']];

const stock=[['Essential medicines','92% facilities reporting available','ok'],['Diagnostics','84% requested tests visible','medium'],['Blood/critical supplies','89% facilities reporting available','ok'],['Data sync','94% reports synced','ok']];
govStock.innerHTML=stock.map(s=>`<div class="list-row"><div><b>${s[0]}</b><small>${s[1]}</small></div><span class="right pill ${s[2]}">${s[2]==='ok'?'On track':'Watch'}</span></div>`).join('');
