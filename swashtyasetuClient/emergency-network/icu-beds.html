<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICU & Bed Availability — SwasthyaSetu</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
  .bedcard{padding:20px;}
  .bedcard h4{font-size:15px;}
  .ward-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px;}
  .ward{background:var(--surface-2);border-radius:10px;padding:12px 14px;}
  .ward .top{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);}
  .ward .fig{font-family:var(--font-mono);font-size:17px;font-weight:600;margin-top:4px;}
  .list{display:flex;flex-direction:column;gap:14px;margin-top:20px;}
  @media (max-width:920px){ .ward-grid{grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body><section class="section" style="padding-bottom:0;">
  <div class="container">
    <div class="eyebrow">Module 08</div>
    <h1 style="font-size:32px;margin-top:10px;">ICU & Bed Availability</h1>
    <p class="muted mt-16" style="max-width:640px;font-size:15px;">Ward-level occupancy across every hospital on the grid — this is what decides where an ambulance gets routed.</p>
  </div>
</section>

<section class="container mt-24">
  <div class="grid grid-4" id="networkStats"></div>
</section>

<section class="container mt-24" id="quickDemoBeds"><div class="card card-pad"><div class="eyebrow">FAST ACCESS • DEMO</div><h3 style="margin-top:8px;">Quick bed availability</h3><p class="faint mt-8">Tap any simulated facility to see its demo bed details.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px;"><button class="card" onclick="rsToast('Sanjeevani General Hospital','ICU: 4 beds • HDU: 7 beds • DEMO DATA','ok')" style="padding:16px;text-align:left;cursor:pointer"><b>Sanjeevani General Hospital</b><div class="faint">ICU: 4 available</div></button><button class="card" onclick="rsToast('City Trauma Centre','ICU: 2 beds • Ventilators: 3 • DEMO DATA','ok')" style="padding:16px;text-align:left;cursor:pointer"><b>City Trauma Centre</b><div class="faint">ICU: 2 available</div></button><button class="card" onclick="rsToast('Swasthya Care Centre','HDU: 6 beds • ICU waitlist • DEMO DATA','warn')" style="padding:16px;text-align:left;cursor:pointer"><b>Swasthya Care Centre</b><div class="faint">HDU: 6 available</div></button></div></div></section>
<section class="container">
  <div class="list" id="bedList"></div>
</section>

<script src="assets/shared.js"></script>
<script>
rsInitShell('icu-beds.html');

function totals(key){
  return RS_HOSPITALS.reduce((acc,h)=>{acc.total+=h.beds[key].total; acc.occ+=h.beds[key].occupied; return acc;}, {total:0,occ:0});
}
const gT = totals('general'), iT = totals('icu'), vT = totals('ventilator'), pT = totals('pediatric');

document.getElementById('networkStats').innerHTML = `
  <div class="stat-tile"><div class="num">${gT.total-gT.occ}</div><div class="label">General beds free network-wide</div></div>
  <div class="stat-tile"><div class="num">${iT.total-iT.occ}</div><div class="label">ICU beds free network-wide</div></div>
  <div class="stat-tile"><div class="num">${vT.total-vT.occ}</div><div class="label">Ventilators free</div></div>
  <div class="stat-tile"><div class="num">${pT.total-pT.occ}</div><div class="label">Paediatric beds free</div></div>
`;

function color(pct){ return pct>=92?'var(--alert)':pct>=75?'var(--warning)':'var(--accent)'; }

document.getElementById('bedList').innerHTML = RS_HOSPITALS.map(h => `
  <div class="card bedcard">
    <div class="flex-between">
      <h4>${h.name} <span class="faint" style="font-weight:400;font-size:12.5px;">· ${h.area}</span></h4>
      <span class="pill ${h.status==='full'?'pill-alert':h.status==='busy'?'pill-warn':'pill-ok'}">${h.status==='full'?'At capacity':h.status==='busy'?'Filling up':'Accepting patients'}</span>
    </div>
    <div class="ward-grid">
      ${['general','icu','ventilator','pediatric'].map(k=>{
        const b=h.beds[k]; const pct=(b.occupied/b.total)*100;
        return `<div class="ward">
          <div class="top"><span>${k==='icu'?'ICU':k==='pediatric'?'Paediatric':k.charAt(0).toUpperCase()+k.slice(1)}</span><span>${Math.round(pct)}%</span></div>
          <div class="fig">${b.total-b.occupied}<span style="font-size:12px;color:var(--ink-faint);font-weight:400;"> / ${b.total} free</span></div>
          <div class="meter mt-8"><div class="meter-fill" style="width:${pct}%;background:${color(pct)}"></div></div>
        </div>`;
      }).join('')}
    </div>
  </div>
`).join('');
</script>
</body>
</html>
