<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SwasthyaSetu</title><link rel="stylesheet" href="assets/styles.css"></head><body><script src="assets/shared.js"></script><script src="assets/api.js"></script><script>ssPage('health-record.html', `<div class="page-head"><div><h1 data-en="Longitudinal Health Records" data-hi="दीर्घकालिक स्वास्थ्य रिकॉर्ड">Longitudinal Health Records</h1><p data-en="Keep care history connected across visits" data-hi="हर विजिट में देखभाल इतिहास को जोड़कर रखें">Keep care history connected across visits</p></div><span class="badge">● <span data-en="Live Demo" data-hi="लाइव डेमो">Live Demo</span></span></div><div class="notice" data-en="Demo data only. A production healthcare system requires approved consent, security, role-based access and health-data integrations." data-hi="केवल डेमो डेटा। वास्तविक स्वास्थ्य प्रणाली के लिए अनुमोदित सहमति, सुरक्षा और एक्सेस नियंत्रण आवश्यक हैं।">Demo data only. A production healthcare system requires approved consent, security, role-based access and health-data integrations.</div><div class="panel"><div class="panel-head"><h3 data-en="Patient records" data-hi="मरीज रिकॉर्ड">Patient records</h3></div><div id="recordTable" class="table-wrap"></div></div>`);</script><script>SS_API.get('/records').then(ps=>{recordTable.innerHTML=`<table class="table"><thead><tr><th>ID</th><th>Name</th><th>Village</th><th>Created</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${ssEsc(p.id)}</td><td>${ssEsc(p.name||p.patientName||'Unnamed')}</td><td>${ssEsc(p.village||'—')}</td><td>${p.createdAt?new Date(p.createdAt).toLocaleString():'Demo record'}</td></tr>`).join('')||'<tr><td colspan="4">No backend records yet.</td></tr>'}</tbody></table>`}).catch(e=>ssToast('Backend not available'))</script></body></html>
