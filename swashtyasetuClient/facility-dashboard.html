></div></div>`);</script><script>SS_API.get('/dashboard').then(d=>{fdFacilities.textContent=d.facilities;fdDoctors.textContent=d.doctors;fdBeds.textContent=d.beds;fdRefs.textContent=d.pendingReferrals}).catch(()=>ssToast('Backend not available'))</script></body></html>
