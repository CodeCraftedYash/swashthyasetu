<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SwasthyaSetu</title><link rel="stylesheet" href="assets/styles.css"></head><body><script src="assets/shared.js"></script><script src="assets/api.js"></script><script>ssPage('triage.html', `<div class="page-head"><div><h1 data-en="Symptom Check & Severity Support" data-hi="लक्षण जांच और गंभीरता सहायता">Symptom Check & Severity Support</h1><p data-en="Explainable decision support — not a disease diagnosis" data-hi="स्पष्ट निर्णय सहायता — बीमारी का निदान नहीं">Explainable decision support — not a disease diagnosis</p></div><span class="badge">● <span data-en="Live Demo" data-hi="लाइव डेमो">Live Demo</span></span></div><div class="notice" data-en="For emergencies or rapidly worsening symptoms, use Emergency SOS or contact local emergency services. This prototype does not replace a clinician." data-hi="आपात स्थिति या तेजी से बिगड़ते लक्षणों में Emergency SOS का उपयोग करें। यह प्रोटोटाइप डॉक्टर का विकल्प नहीं है।">For emergencies or rapidly worsening symptoms, use Emergency SOS or contact local emergency services. This prototype does not replace a clinician.</div><div class="grid-2"><div class="panel"><div class="panel-head"><h3 data-en="Assessment details" data-hi="आकलन विवरण">Assessment details</h3></div><form id="triageForm" class="panel-pad form-grid"><div class="field"><label data-en="Patient name" data-hi="मरीज का नाम">Patient name</label><input id="patientName" required></div><div class="field"><label data-en="Village" data-hi="गांव">Village</label><input id="village"></div><div class="field full"><label data-en="Symptoms (comma separated)" data-hi="लक्षण (कॉमा से अलग करें)">Symptoms (comma separated)</label><textarea id="symptoms" required placeholder="Fever, cough, dizziness..."></textarea></div><div class="field"><label data-en="Risk score (0–100 demo input)" data-hi="जोखिम स्कोर (0–100 डेमो इनपुट)">Risk score (0–100 demo input)</label><input id="score" type="number" min="0" max="100" value="10"></div><div class="field"><label data-en="Assessment assisted by ASHA?" data-hi="क्या ASHA ने सहायता की?">Assessment assisted by ASHA?</label><select id="asha"><option value="false">No / नहीं</option><option value="true">Yes / हाँ</option></select></div><div class="field full"><button class="btn red" data-en="Get care guidance" data-hi="देखभाल मार्गदर्शन प्राप्त करें">Get care guidance</button></div></form></div><div class="panel"><div class="panel-head"><h3 data-en="How the guidance works" data-hi="मार्गदर्शन कैसे काम करता है">How the guidance works</h3></div><div class="panel-pad"><div class="flow"><div class="step" data-en="Symptoms" data-hi="लक्षण">Symptoms</div><span class="arrow">→</span><div class="step" data-en="Risk score" data-hi="जोखिम स्कोर">Risk score</div><span class="arrow">→</span><div class="step" data-en="Urgency" data-hi="तत्कालता">Urgency</div><span class="arrow">→</span><div class="step" data-en="Next care level" data-hi="अगला देखभाल स्तर">Next care level</div></div><div id="triageResult" class="result"></div></div></div></div>`);</script><script>document.getElementById('triageForm').addEventListener('submit',async e=>{e.preventDefault();try{const r=await SS_API.post('/triage',{patientName:patientName.value,village:village.value,symptoms:symptoms.value.split(',').map(x=>x.trim()).filter(Boolean),score:+score.value,ashaAssisted:asha.value==='true'});triageResult.innerHTML=`<b>${r.level.toUpperCase()} RISK</b><p style="margin:8px 0">${ssEsc(r.recommendation)}</p><small>Score: ${r.score}/100 · Saved to backend</small>`;triageResult.className='result show';ssToast('Assessment saved to backend')}catch(err){ssToast(err.message)}})</script></body></html>
