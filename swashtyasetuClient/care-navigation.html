<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SwasthyaSetu</title><link rel="stylesheet" href="assets/styles.css"></head><body><script src="assets/shared.js"></script><script src="assets/api.js"></script><script>ssPage('care-navigation.html', `<div class="page-head"><div><h1 data-en="Smart Care Navigation" data-hi="स्मार्ट केयर नेविगेशन">Smart Care Navigation</h1><p data-en="Match the patient to the right level of public healthcare" data-hi="मरीज को सही सार्वजनिक स्वास्थ्य सेवा स्तर से मिलाएं">Match the patient to the right level of public healthcare</p></div><span class="badge">● <span data-en="Live Demo" data-hi="लाइव डेमो">Live Demo</span></span></div><div class="hero-card"><h2 data-en="No Wrong Door for Rural Healthcare" data-hi="ग्रामीण स्वास्थ्य सेवा के लिए सही मार्ग">No Wrong Door for Rural Healthcare</h2><p data-en="Whether a person starts with an ASHA worker, symptom check, PHC or emergency request, SwasthyaSetu recommends the next appropriate care step and keeps the journey connected." data-hi="चाहे व्यक्ति ASHA, लक्षण जांच, PHC या आपात अनुरोध से शुरुआत करे, स्वास्थ्यसेतु अगला उपयुक्त देखभाल कदम सुझाता है और यात्रा को जोड़कर रखता है।">Whether a person starts with an ASHA worker, symptom check, PHC or emergency request, SwasthyaSetu recommends the next appropriate care step and keeps the journey connected.</p></div><div class="grid-2"><div class="panel"><div class="panel-head"><h3 data-en="Care pathway" data-hi="देखभाल मार्ग">Care pathway</h3></div><div class="panel-pad"><div class="flow"><div class="step">ASHA / Citizen</div><span class="arrow">→</span><div class="step">Assess</div><span class="arrow">→</span><div class="step">Match facility</div><span class="arrow">→</span><div class="step">Refer</div><span class="arrow">→</span><div class="step">Follow-up</div></div></div></div><div class="panel"><div class="panel-head"><h3 data-en="Matching factors" data-hi="मिलान कारक">Matching factors</h3></div><div class="panel-pad"><ul style="margin:0;padding-left:20px;line-height:2;color:var(--muted)"><li data-en="Urgency and care level" data-hi="तत्कालता और देखभाल स्तर">Urgency and care level</li><li data-en="Facility capability and services" data-hi="सुविधा क्षमता और सेवाएं">Facility capability and services</li><li data-en="Distance and availability" data-hi="दूरी और उपलब्धता">Distance and availability</li><li data-en="Data freshness before referral" data-hi="रेफरल से पहले डेटा की ताजगी">Data freshness before referral</li></ul></div></div></div><div class="panel" style="margin-top:18px"><div class="panel-head"><h3 data-en="Recommended public facilities" data-hi="सुझाई गई सार्वजनिक सुविधाएं">Recommended public facilities</h3><a href="facility-finder.html">Open finder</a></div><div id="navFacilities" class="table-wrap"><table class="table"><thead><tr><th>Facility</th><th>Type</th><th>Distance</th><th>Services</th></tr></thead><tbody><tr><td colspan="4">Loading...</td></tr></tbody></table></div></div>`);</script><script>SS_API.get('/facilities').then(fs=>{navFacilities.innerHTML=`<table class="table"><thead><tr><th>Facility</th><th>Type</th><th>Distance</th><th>Services</th></tr></thead><tbody>${fs.map(f=>`<tr><td>${ssEsc(f.name)}</td><td>${ssEsc(f.type)}</td><td>${f.distanceKm} km</td><td>${f.services.map(ssEsc).join(', ')}</td></tr>`).join('')}</tbody></table>`}).catch(()=>{})</script></body></html>
