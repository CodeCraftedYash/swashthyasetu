<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SwasthyaSetu</title><link rel="stylesheet" href="assets/styles.css"></head><body><script src="assets/shared.js"></script><script src="assets/api.js"></script><script src="assets/gmaps.js"></script><script>ssPage('facility-finder.html', `<div class="page-head"><div><h1 data-en="Find Public Healthcare Facility" data-hi="सार्वजनिक स्वास्थ्य सुविधा खोजें" data-mr="सार्वजनिक आरोग्य सुविधा शोधा">Find Public Healthcare Facility</h1><p data-en="Compare capability, distance and available services" data-hi="क्षमता, दूरी और उपलब्ध सेवाओं की तुलना करें" data-mr="क्षमता, अंतर आणि उपलब्ध सेवांची तुलना करा">Compare capability, distance and available services</p></div><span class="badge">● <span data-en="Live Demo" data-hi="लाइव डेमो" data-mr="लाइव्ह डेमो">Live Demo</span></span></div><div class="panel panel-pad"><div class="form-grid"><div class="field"><label data-en="Facility type" data-hi="सुविधा प्रकार" data-mr="सुविधा प्रकार">Facility type</label><select id="typeFilter"><option value="">All facilities / सभी</option><option>PHC</option><option>CHC</option><option>District Hospital</option></select></div><div class="field"><label data-en="Service keyword" data-hi="सेवा कीवर्ड" data-mr="सेवा कीवर्ड">Service keyword</label><input id="serviceFilter" placeholder="Emergency, ANC, ICU..."></div><div class="field full" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="facilitySearch" data-en="Search facilities" data-hi="सुविधाएं खोजें" data-mr="सुविधा शोधा">Search facilities</button><button class="btn outline" id="useMyLocation" data-en="📍 Use my real location (Google Maps)" data-hi="📍 मेरी असली लोकेशन इस्तेमाल करें (Google Maps)" data-mr="📍 माझे खरे स्थान वापरा (Google Maps)">📍 Use my real location (Google Maps)</button></div></div></div><div id="mapPanel" style="display:none;margin-top:18px"></div><div class="panel" style="margin-top:18px"><div class="panel-head"><h3 data-en="Network facilities" data-hi="नेटवर्क सुविधाएं" data-mr="नेटवर्क सुविधा">Network facilities</h3><span class="badge" data-en="Check timestamp before referral" data-hi="रेफरल से पहले समय जांचें" data-mr="रेफरलपूर्वी वेळ तपासा">Check timestamp before referral</span></div><div id="facilityTable" class="table-wrap"></div></div><div id="mapsKeyBox" style="margin-top:14px"></div>`);</script>
<script>
document.getElementById('mapsKeyBox').innerHTML = SS_MAPS.keyWidgetHTML('ff');
SS_MAPS.bindKeyWidget('ff', ()=> ssToast(SS_MAPS.hasKey() ? 'Google Maps key saved' : 'Key cleared'));

let userLoc = null;
let lastFacilities = [];

async function loadFacilities(){
  let q=new URLSearchParams();
  if(typeFilter.value)q.set('type',typeFilter.value);
  if(serviceFilter.value)q.set('service',serviceFilter.value);
  const fs=await SS_API.get('/facilities?'+q);
  lastFacilities = fs;
  renderTable(fs);
}

function renderTable(fs){
  facilityTable.innerHTML=`<table class="table"><thead><tr><th>Facility</th><th>Type</th><th>Distance</th><th>Doctors</th><th>Beds</th><th>Last updated</th><th>Map</th></tr></thead><tbody>${fs.map(f=>`<tr><td><b>${ssEsc(f.name)}</b><br><small>${(f.services||[]).map(ssEsc).join(', ')}</small></td><td>${ssEsc(f.type||'')}</td><td>${f.distanceKm ?? '—'} km</td><td>${f.doctors ?? '—'}</td><td>${f.beds ?? '—'}</td><td>${f.lastUpdated?new Date(f.lastUpdated).toLocaleString():'—'}</td><td>${f.lat!=null && userLoc ? `<a class="btn outline btn-sm" target="_blank" rel="noopener" href="${SS_MAPS.directionsUrl(userLoc,{lat:f.lat,lng:f.lng})}">🧭 Directions</a>` : (f.lat!=null?`<a class="btn outline btn-sm" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${f.lat},${f.lng}">🗺 View</a>`:'—')}</td></tr>`).join('')||'<tr><td colspan="7">No matching facility found.</td></tr>'}</tbody></table>`;
}

function showMap(origin, dest, label){
  const panel = document.getElementById('mapPanel');
  panel.style.display = 'block';
  const src = SS_MAPS.embedUrl(origin, dest);
  const link = dest ? SS_MAPS.directionsUrl(origin, dest) : null;
  panel.innerHTML = `<div class="panel" style="padding:0;overflow:hidden"><div class="panel-head" style="padding:14px 18px"><h3 style="margin:0;font-size:15px">🗺 ${ssEsc(label||'Your location')}</h3></div><iframe src="${src}" width="100%" height="320" style="border:0;display:block"></iframe>${link?`<div style="padding:12px 18px"><a class="btn outline btn-sm" href="${link}" target="_blank" rel="noopener">🧭 Open live directions in Google Maps</a></div>`:''}</div>`;
}

document.getElementById('useMyLocation').onclick = () => {
  if(!navigator.geolocation){ ssToast('Geolocation not supported in this browser'); return; }
  ssToast('Getting your real GPS location…');
  navigator.geolocation.getCurrentPosition(async pos => {
    userLoc = {lat: pos.coords.latitude, lng: pos.coords.longitude};
    showMap(userLoc, null, 'Your current location');

    // Live mode: real hospitals from Google Places, if an API key is configured.
    if(SS_MAPS.hasKey()){
      try{
        const hospitals = await SS_MAPS.findNearestHospitals(userLoc.lat, userLoc.lng, {limit:10});
        lastFacilities = hospitals.map(h => ({name:h.name, type:'Hospital (Google)', distanceKm:h.distanceKm, doctors:null, beds:null, lastUpdated:null, services:['Live Google listing'], lat:h.lat, lng:h.lng}));
        renderTable(lastFacilities);
        if(hospitals[0]) showMap(userLoc, {lat:hospitals[0].lat,lng:hospitals[0].lng}, 'Route to nearest: '+hospitals[0].name);
        ssToast('Showing live hospitals from Google Maps');
        return;
      }catch(e){ /* fall back below */ }
    }

    // No key (or Places failed): use our own facility list but with REAL computed distance.
    try{
      const fs = await SS_API.get(`/facilities/nearest?lat=${userLoc.lat}&lng=${userLoc.lng}`);
      lastFacilities = fs;
      renderTable(fs);
      if(fs[0]) showMap(userLoc, {lat:fs[0].lat,lng:fs[0].lng}, 'Route to nearest: '+fs[0].name);
      ssToast('Sorted by real distance from your location');
    }catch(e){ ssToast('Could not reach backend for distance sort'); }
  }, () => ssToast('Location permission denied — showing default list'), {timeout:10000});
};

facilitySearch.onclick=()=>loadFacilities().catch(e=>ssToast(e.message));
loadFacilities().catch(e=>ssToast('Backend not available'));
</script></body></html>
