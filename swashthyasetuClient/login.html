<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • SwasthyaSetu</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#063b4c"><link rel="stylesheet" href="assets/styles.css"><style>body{min-height:100vh;margin:0;display:grid;place-items:center;background:linear-gradient(135deg,#eef9fb,#e8f0f5);font-family:Arial,sans-serif}.login{width:min(780px,90vw);display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 25px 70px rgba(16,66,88,.2)}.brand{padding:24px;background:linear-gradient(145deg,#063b4c,#087d86);color:#fff;position:relative}.logo{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:900}.cross{width:40px;height:40px;border-radius:14px;background:#e63946;display:grid;place-items:center;font-size:27px;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.18)}.brand h1{display:none}.brand p{display:none}.logo{font-size:32px;letter-spacing:.5px}.logo .cross{width:48px;height:48px;font-size:31px}.login-swasthya{color:#ffffff !important}.login-setu{color:#e63946}.tag{display:none}.form{padding:24px}.form h2{font-size:23px;margin:0 0 8px;color:#073b4c}.form input{width:100%;box-sizing:border-box;padding:11px;margin:5px 0 10px;border:1px solid #c8d9df;border-radius:13px;font-size:16px}.form button{width:100%;padding:12px;border:0;border-radius:13px;background:#e63946;color:#fff;font-size:17px;font-weight:900;cursor:pointer}.demo{margin-top:20px;padding:14px;background:#f3f7f8;border-radius:12px;font-size:13px}@media(max-width:700px){.login{grid-template-columns:1fr}.brand,.form{padding:32px}}</style></head><body><main class="login"><section class="brand"><div class="logo"><div class="cross">✚</div><span><span class="login-swasthya">SWASTHYA</span> <span class="login-setu">SETU</span></span></div><div class="tag">SIH26133 • Prototype Demo</div></section><section class="form"><h2>Welcome to SwasthyaSetu</h2><p>Sign in to access your healthcare dashboard.</p><label>Login as / लॉगिन भूमिका</label><select id="role"><option>Patient / मरीज</option><option>ASHA Worker / आशा कार्यकर्ता</option><option>Traffic Police / ट्रैफिक पुलिस</option><option>Doctor / डॉक्टर</option><option>Government / सरकारी अधिकारी</option></select><label>Username</label><input id="u" placeholder="Enter username" value="demo"><label>Password</label><input id="pw" type="password" placeholder="Enter password" value="demo123"><button id="login">Login to SwasthyaSetu →</button><div class="demo"><b>Demo access:</b> Username: <b>demo</b> &nbsp; Password: <b>demo123</b></div><p id="msg" style="color:#c92a2a"></p></section></main><script>document.getElementById('login').onclick=()=>{const u=document.getElementById('u').value.trim(),p=document.getElementById('pw').value;if(u&&p){sessionStorage.setItem('ssLoggedIn','1');sessionStorage.setItem('ssRole',document.getElementById('role').value);sessionStorage.setItem('ssWelcomePending','1');const role=document.getElementById('role').value;if(role.startsWith('Doctor'))location.href='doctor-dashboard.html';else if(role.startsWith('Traffic'))location.href='traffic-police-dashboard.html';else if(role.startsWith('Government'))location.href='government-dashboard.html';else location.href='index.html'}else document.getElementById('msg').textContent='Please enter username and password.'};document.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('login').click()});</script></body></html>
