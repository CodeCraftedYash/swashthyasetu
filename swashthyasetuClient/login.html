<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-en="Login • SwasthyaSetu" data-hi="लॉगिन • स्वास्थ्यसेतु" data-mr="लॉगिन • स्वास्थ्यसेतू">Login • SwasthyaSetu</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#063b4c"><link rel="stylesheet" href="assets/styles.css"><style>body{min-height:100vh;margin:0;display:grid;place-items:center;background:linear-gradient(135deg,#eef9fb,#e8f0f5);font-family:Arial,sans-serif}.login{width:min(780px,90vw);display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 25px 70px rgba(16,66,88,.2)}.brand{padding:24px;background:linear-gradient(145deg,#063b4c,#087d86);color:#fff;position:relative}.logo{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:900}.cross{width:40px;height:40px;border-radius:14px;background:#e63946;display:grid;place-items:center;font-size:27px;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.18)}.brand h1{display:none}.brand p{display:none}.logo{font-size:32px;letter-spacing:.5px}.logo .cross{width:48px;height:48px;font-size:31px}.login-swasthya{color:#ffffff !important}.login-setu{color:#e63946}.tag{display:none}.form{padding:24px}.form h2{font-size:23px;margin:0 0 8px;color:#073b4c}.form input{width:100%;box-sizing:border-box;padding:11px;margin:5px 0 10px;border:1px solid #c8d9df;border-radius:13px;font-size:16px}.form button{width:100%;padding:12px;border:0;border-radius:13px;background:#e63946;color:#fff;font-size:17px;font-weight:900;cursor:pointer}.demo{margin-top:20px;padding:14px;background:#f3f7f8;border-radius:12px;font-size:13px}@media(max-width:700px){.login{grid-template-columns:1fr}.brand,.form{padding:32px}}</style></head><body><div style="position:fixed;top:14px;right:14px;z-index:50"><div class="lang-switch" role="group" aria-label="Language"><button type="button" class="lang-opt" data-l="en" onclick="ssSetLanguage('en')">EN</button><button type="button" class="lang-opt" data-l="hi" onclick="ssSetLanguage('hi')">हिं</button><button type="button" class="lang-opt" data-l="mr" onclick="ssSetLanguage('mr')">मरा</button></div></div><script src="assets/shared.js"></script><main class="login"><section class="brand"><div class="logo"><div class="cross">✚</div><span><span class="login-swasthya" data-en="SWASTHYA" data-hi="स्वास्थ्य" data-mr="स्वास्थ्य">SWASTHYA</span> <span class="login-setu" data-en="SETU" data-hi="सेतु" data-mr="सेतू">SETU</span></span></div><div class="tag" data-en="SIH26133 • Prototype Demo" data-hi="SIH26133 • प्रोटोटाइप डेमो" data-mr="SIH26133 • प्रोटोटाइप डेमो">SIH26133 • Prototype Demo</div></section><section class="form"><h2 data-en="Welcome to SwasthyaSetu" data-hi="स्वास्थ्यसेतु में आपका स्वागत है" data-mr="स्वास्थ्यसेतूमध्ये आपले स्वागत आहे">Welcome to SwasthyaSetu</h2><p data-en="Sign in to access your healthcare dashboard." data-hi="अपने स्वास्थ्य डैशबोर्ड तक पहुंचने के लिए साइन इन करें।" data-mr="तुमच्या आरोग्य डॅशबोर्डवर जाण्यासाठी साइन इन करा.">Sign in to access your healthcare dashboard.</p><label data-en="Login as / लॉगिन भूमिका" data-hi="लॉगिन भूमिका" data-mr="लॉगिन भूमिका">Login as / लॉगिन भूमिका</label><select id="role"><option value="Patient / मरीज" data-en="Patient / मरीज" data-hi="मरीज" data-mr="रुग्ण">Patient / मरीज</option><option value="ASHA Worker / आशा कार्यकर्ता" data-en="ASHA Worker / आशा कार्यकर्ता" data-hi="आशा कार्यकर्ता" data-mr="आशा कार्यकर्ती">ASHA Worker / आशा कार्यकर्ता</option><option value="Traffic Police / ट्रैफिक पुलिस" data-en="Traffic Police / ट्रैफिक पुलिस" data-hi="ट्रैफिक पुलिस" data-mr="ट्रॅफिक पोलीस">Traffic Police / ट्रैफिक पुलिस</option><option value="Doctor / डॉक्टर" data-en="Doctor / डॉक्टर" data-hi="डॉक्टर" data-mr="डॉक्टर">Doctor / डॉक्टर</option><option value="Government / सरकारी अधिकारी" data-en="Government / सरकारी अधिकारी" data-hi="सरकारी अधिकारी" data-mr="सरकारी अधिकारी">Government / सरकारी अधिकारी</option></select><label data-en="Username" data-hi="उपयोगकर्ता नाम" data-mr="वापरकर्ता नाव">Username</label><input id="u" placeholder="Enter username" value="demo"><label data-en="Password" data-hi="पासवर्ड" data-mr="पासवर्ड">Password</label><input id="pw" type="password" placeholder="Enter password" value="demo123"><button id="login" data-en="Login to SwasthyaSetu →" data-hi="स्वास्थ्यसेतु में लॉगिन करें →" data-mr="स्वास्थ्यसेतूमध्ये लॉगिन करा →">Login to SwasthyaSetu →</button><div class="demo"><b data-en="Demo access:" data-hi="डेमो एक्सेस:" data-mr="डेमो प्रवेश:">Demo access:</b> Username: <b data-en="demo" data-hi="demo" data-mr="demo">demo</b> &nbsp; Password: <b data-en="demo123" data-hi="demo123" data-mr="demo123">demo123</b></div><p id="msg" style="color:#c92a2a"></p></section></main><script>document.getElementById('login').onclick=()=>{const u=document.getElementById('u').value.trim(),p=document.getElementById('pw').value;if(u&&p){sessionStorage.setItem('ssLoggedIn','1');sessionStorage.setItem('ssRole',document.getElementById('role').value);sessionStorage.setItem('ssWelcomePending','1');const role=document.getElementById('role').value;if(role.startsWith('Doctor'))location.href='doctor-dashboard.html';else if(role.startsWith('Traffic'))location.href='traffic-police-dashboard.html';else if(role.startsWith('Government'))location.href='government-dashboard.html';else location.href='index.html'}else document.getElementById('msg').textContent='Please enter username and password.'};document.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('login').click()});</script><script>ssApplyLanguage();if(window.ssAddVoiceAssistant)ssAddVoiceAssistant();</script></body></html>
