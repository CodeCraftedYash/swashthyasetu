<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Traffic Police Emergency Desk • SwasthyaSetu</title><link rel="stylesheet" href="assets/styles.css"></head><body>
<script src="assets/shared.js"></script>
<script>ssPage('traffic-police-dashboard.html', `

<section class="panel"><div class="panel-head"><h3 data-en="Incident command view" data-hi="घटना कमांड व्यू">Incident command view</h3><a href="emergency-network/ambulance.html">Track ambulance</a></div><div class="panel-pad"><div class="notice"><b>📍 Demo incident: NH-33 / Mango</b><br>Nearest suitable facility: <b>MGM Medical College Hospital</b><br>Ambulance: <b>JH01-AMB-2214</b> · ETA <b>8 min</b><br><span class="pill high" style="display:inline-block;margin-top:8px">Critical</span></div><div class="flow" style="margin-top:18px;flex-wrap:wrap"><div class="step">Incident</div><span class="arrow">→</span><div class="step">SOS</div><span class="arrow">→</span><div class="step">Ambulance</div><span class="arrow">→</span><div class="step">Hospital alert</div><span class="arrow">→</span><div class="step">Patient received</div></div></div></section></div>

<script>
