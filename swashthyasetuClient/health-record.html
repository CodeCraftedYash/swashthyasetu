<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-en="SwasthyaSetu" data-hi="SwasthyaSetu" data-mr="SwasthyaSetu">SwasthyaSetu</title><link rel="stylesheet" href="assets/styles.css"></head><body><script src="assets/shared.js"></script><script src="assets/api.js"></script><script>ssPage('health-record.html', `<div class="page-head"><div><h1 data-en="Longitudinal Health Records" data-hi="दीर्घकालिक स्वास्थ्य रिकॉर्ड" data-mr="दीर्घकालीन आरोग्य नोंदी">Longitudinal Health Records</h1><p data-en="Keep care history connected across visits" data-hi="हर विजिट में देखभाल इतिहास को जोड़कर रखें" data-mr="प्रत्येक भेटीत काळजी इतिहास जोडलेला ठेवा">Keep care history connected across visits</p></div><span class="badge">● <span data-en="Live Demo" data-hi="लाइव डेमो" data-mr="लाइव्ह डेमो">Live Demo</span></span></div><div class="notice" data-en="Demo data only. A production healthcare system requires approved consent, security, role-based access and health-data integrations." data-hi="केवल डेमो डेटा। वास्तविक स्वास्थ्य प्रणाली के लिए अनुमोदित सहमति, सुरक्षा और एक्सेस नियंत्रण आवश्यक हैं।" data-mr="फक्त डेमो डेटा. उत्पादन आरोग्य प्रणालीसाठी मान्यताप्राप्त संमती, सुरक्षा व भूमिका-आधारित प्रवेश आवश्यक आहे.">Demo data only. A production healthcare system requires approved consent, security, role-based access and health-data integrations.</div><div class="panel"><div class="panel-head"><h3 data-en="Patient records" data-hi="मरीज रिकॉर्ड" data-mr="रुग्ण नोंदी">Patient records</h3></div><div id="recordTable" class="table-wrap"></div></div>`);</script><script>
function sevPillClass(s){return {LOW:'ok',MODERATE:'medium',HIGH:'high',EMERGENCY:'high'}[s]||''}
SS_API.get('/records').then(ps=>{recordTable.innerHTML=`<table class="table"><thead><tr><th data-en="ID" data-hi="आईडी" data-mr="आयडी">ID</th><th data-en="Name" data-hi="नाम" data-mr="नाव">Name</th><th data-en="Village" data-hi="गांव" data-mr="गाव">Village</th><th data-en="Severity" data-hi="गंभीरता" data-mr="तीव्रता">Severity</th><th data-en="Symptoms" data-hi="लक्षण" data-mr="लक्षणे">Symptoms</th><th data-en="Guidance" data-hi="मार्गदर्शन" data-mr="मार्गदर्शन">Guidance</th><th data-en="Source" data-hi="स्रोत" data-mr="स्रोत">Source</th><th data-en="Created" data-hi="बनाया गया" data-mr="तयार केले">Created</th></tr></thead><tbody>${ps.map(p=>{
  const symptoms=Array.isArray(p.symptoms)?p.symptoms.join(', '):(p.symptoms||'—');
  const sevBadge=p.severity?`<span class="pill ${sevPillClass(p.severity)}">${ssEsc(p.severity)}</span>`:'—';
  return `<tr><td>${ssEsc(p.id)}</td><td>${ssEsc(p.name||p.patientName||'Unnamed')}</td><td>${ssEsc(p.village||'—')}</td><td>${sevBadge}</td><td>${ssEsc(symptoms)}</td><td>${ssEsc(p.guidance||'—')}</td><td>${ssEsc(p.source||'manual')}</td><td>${p.createdAt?new Date(p.createdAt).toLocaleString():'Demo record'}</td></tr>`;
}).join('')||'<tr><td colspan="8" data-en="No backend records yet." data-hi="अभी बैकएंड रिकॉर्ड नहीं है।" data-mr="अद्याप बॅकएंड नोंदी नाहीत.">No backend records yet.</td></tr>'}</tbody></table>`}).catch(e=>ssToast('Backend not available'))
</script></body></html>
