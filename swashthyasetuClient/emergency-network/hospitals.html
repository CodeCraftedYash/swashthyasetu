<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-en="Hospital Availability — SwasthyaSetu" data-hi="अस्पताल उपलब्धता — स्वास्थ्यसेतु" data-mr="रुग्णालय उपलब्धता — स्वास्थ्यसेतू">Hospital Availability — SwasthyaSetu</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:22px;}
  .toolbar input, .toolbar select{border:1px solid var(--border);border-radius:9px;padding:10px 14px;font-size:13.5px;font-family:var(--font-body);background:#fff;}
  .toolbar input{flex:1;min-width:220px;}
  .hlist{margin-top:22px;display:flex;flex-direction:column;gap:14px;}
  .hcard{padding:20px;display:grid;grid-template-columns:1.6fr 2fr auto;gap:22px;align-items:center;}
  .hcard h3{font-size:16.5px;}
  .hcard .meta{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .bedrow{display:flex;gap:18px;flex-wrap:wrap;}
  .bedmini{min-width:100px;}
  .bedmini .lbl{font-size:11px;color:var(--ink-faint);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.03em;}
  .bedmini .fig{font-family:var(--font-mono);font-size:13px;font-weight:600;margin-top:2px;}
  .hcard .meter{width:100%;margin-top:6px;}
  .actions{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:150px;}
  @media (max-width:920px){ .hcard{grid-template-columns:1fr;} }
</style>
</head>
<body><section class="section" style="padding-bottom:0;">
  <div class="container">
    <div class="eyebrow" data-en="Module 03" data-hi="मॉड्यूल 03" data-mr="मॉड्यूल 03">Module 03</div>
    <h1 style="font-size:32px;margin-top:10px;" data-en="Hospital Availability" data-hi="अस्पताल उपलब्धता" data-mr="रुग्णालय उपलब्धता">Hospital Availability</h1>
    <p class="muted mt-16" style="max-width:640px;font-size:15px;" data-en="Live bed counts and specialties across the network — sorted by distance from you, so you know before you travel." data-hi="नेटवर्क में लाइव बेड गिनती व विशेषज्ञताएं — आपसे दूरी अनुसार क्रमबद्ध, ताकि यात्रा से पहले ही पता हो।" data-mr="नेटवर्कमधील लाइव्ह बेड मोजणी व तज्ज्ञता — तुमच्यापासूनच्या अंतरानुसार क्रमवारीत, जेणेकरून प्रवासापूर्वीच कळेल.">Live bed counts and specialties across the network — sorted by distance from you, so you know before you travel.</p>

    <div class="toolbar">
      <input id="search" type="text" placeholder="Search hospital name or area…">
      <select id="specFilter">
        <option value="" data-en="All specialties" data-hi="सभी विशेषज्ञताएं" data-mr="सर्व तज्ज्ञता">All specialties</option>
        <option value="Trauma" data-en="Trauma" data-hi="आघात" data-mr="इजा">Trauma</option><option value="Cardiology" data-en="Cardiology" data-hi="हृदय रोग" data-mr="हृदयरोग">Cardiology</option><option value="Neurology" data-en="Neurology" data-hi="तंत्रिका विज्ञान" data-mr="न्यूरोलॉजी">Neurology</option>
        <option value="Orthopaedics" data-en="Orthopaedics" data-hi="हड्डी रोग" data-mr="अस्थिरोग">Orthopaedics</option><option value="Paediatrics" data-en="Paediatrics" data-hi="बाल रोग" data-mr="बालरोग">Paediatrics</option><option value="Burns" data-en="Burns" data-hi="जलना" data-mr="भाजणे">Burns</option><option value="General Surgery" data-en="General Surgery" data-hi="सामान्य सर्जरी" data-mr="सामान्य शस्त्रक्रिया">General Surgery</option>
      </select>
      <select id="statusFilter">
        <option value="" data-en="Any availability" data-hi="कोई भी उपलब्धता" data-mr="कोणतीही उपलब्धता">Any availability</option>
        <option value="available" data-en="Beds available" data-hi="बेड उपलब्ध" data-mr="बेड उपलब्ध">Beds available</option>
        <option value="busy" data-en="Limited beds" data-hi="सीमित बेड" data-mr="मर्यादित बेड">Limited beds</option>
      </select>
    </div>
  </div>
</section>

<section class="container mt-24" id="quickDemo"><div class="card card-pad"><div class="eyebrow" data-en="FAST ACCESS • DEMO" data-hi="तेज़ पहुंच • डेमो" data-mr="जलद प्रवेश • डेमो">FAST ACCESS • DEMO</div><h3 style="margin-top:8px;" data-en="Quick demo hospitals — tap to view" data-hi="त्वरित डेमो अस्पताल — देखने के लिए टैप करें" data-mr="द्रुत डेमो रुग्णालये — पाहण्यासाठी टॅप करा">Quick demo hospitals — tap to view</h3><p class="faint mt-8" data-en="Simulated demo data — available without typing in search." data-hi="सिम्युलेटेड डेमो डेटा — बिना टाइप किए सर्च में उपलब्ध।" data-mr="सिम्युलेटेड डेमो डेटा — न टाइप करता शोधात उपलब्ध.">Simulated demo data — available without typing in search.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:16px;"><button class="card" type="button" style="text-align:left;padding:16px;cursor:pointer;border:1px solid var(--border);" onclick="document.getElementById('search').value='Sanjeevani General Hospital';render();window.scrollTo({top:document.querySelector('section.container').offsetTop,behavior:'smooth'})"><b data-en="Sanjeevani General Hospital" data-hi="संजीवनी जनरल अस्पताल" data-mr="संजीवनी जनरल रुग्णालय">Sanjeevani General Hospital</b><div class="faint" style="font-size:12px;margin-top:5px;" data-en="Emergency • ICU • Trauma" data-hi="आपातकाल • ICU • आघात" data-mr="आणीबाणी • ICU • आघात">Emergency • ICU • Trauma</div><div class="pill pill-ok" style="margin-top:10px;display:inline-flex;" data-en="2.1 km" data-hi="2.1 किमी" data-mr="2.1 किमी">2.1 km</div></button><button class="card" type="button" style="text-align:left;padding:16px;cursor:pointer;border:1px solid var(--border);" onclick="document.getElementById('search').value='Jamshedpur City Hospital';render();window.scrollTo({top:document.querySelector('section.container').offsetTop,behavior:'smooth'})"><b data-en="Jamshedpur City Hospital" data-hi="जमशेदपुर सिटी अस्पताल" data-mr="जमशेदपूर सिटी रुग्णालय">Jamshedpur City Hospital</b><div class="faint" style="font-size:12px;margin-top:5px;" data-en="24×7 Emergency • Cardiology" data-hi="24×7 आपातकाल • हृदय रोग" data-mr="24×7 आणीबाणी • हृदयरोग">24×7 Emergency • Cardiology</div><div class="pill pill-ok" style="margin-top:10px;display:inline-flex;" data-en="3.4 km" data-hi="3.4 किमी" data-mr="3.4 किमी">3.4 km</div></button><button class="card" type="button" style="text-align:left;padding:16px;cursor:pointer;border:1px solid var(--border);" onclick="document.getElementById('search').value='Swasthya Care Centre';render();window.scrollTo({top:document.querySelector('section.container').offsetTop,behavior:'smooth'})"><b data-en="Swasthya Care Centre" data-hi="स्वास्थ्य केयर सेंटर" data-mr="स्वास्थ्य केअर सेंटर">Swasthya Care Centre</b><div class="faint" style="font-size:12px;margin-top:5px;" data-en="General • Paediatrics" data-hi="सामान्य • बाल रोग" data-mr="सामान्य • बालरोग">General • Paediatrics</div><div class="pill pill-ok" style="margin-top:10px;display:inline-flex;" data-en="4.0 km" data-hi="4.0 किमी" data-mr="4.0 किमी">4.0 km</div></button></div></div></section>
<section class="container">
  <div class="hlist" id="hlist"></div>
</section>

<script src="assets/shared.js"></script>
<script>
rsInitShell('hospitals.html');

function statusPill(h){
  if (h.status === 'full') return '<span class="pill pill-alert" data-en="Full — no beds" data-hi="भरा — कोई बेड नहीं" data-mr="पूर्ण — बेड नाही">Full — no beds</span>';
  if (h.status === 'busy') return '<span class="pill pill-warn" data-en="Limited beds" data-hi="सीमित बेड" data-mr="मर्यादित बेड">Limited beds</span>';
  return '<span class="pill pill-ok" data-en="Beds available" data-hi="बेड उपलब्ध" data-mr="बेड उपलब्ध">Beds available</span>';
}
function bedColor(occ, total){
  const pct = occ/total;
  return pct >= .92 ? 'var(--alert)' : pct >= .75 ? 'var(--warning)' : 'var(--accent)';
}

function render(){
  const q = document.getElementById('search').value.toLowerCase();
  const spec = document.getElementById('specFilter').value;
  const stat = document.getElementById('statusFilter').value;

  const list = RS_HOSPITALS
    .filter(h => (h.name+h.area).toLowerCase().includes(q))
    .filter(h => !spec || h.specialties.includes(spec))
    .filter(h => !stat || h.status === stat || (stat==='available' && h.status==='available'))
    .sort((a,b)=>a.distanceKm-b.distanceKm);

  document.getElementById('hlist').innerHTML = list.map(h => `
    <div class="card hcard">
      <div>
        <h3>${h.name}</h3>
        <div class="meta">${h.area} · ${h.distanceKm} km away · ${h.level}</div>
        <div class="mt-8">${statusPill(h)}</div>
        <div class="tag-row mt-16">${h.specialties.map(s=>`<span class="badge-dept">${s}</span>`).join('')}</div>
      </div>
      <div class="bedrow">
        ${['general','icu','ventilator','pediatric'].map(k => {
          const b = h.beds[k]; const free = b.total-b.occupied;
          return `<div class="bedmini">
            <div class="lbl">${k==='icu'?'ICU':k==='pediatric'?'Paediatric':k.charAt(0).toUpperCase()+k.slice(1)}</div>
            <div class="fig">${free} / ${b.total} free</div>
            <div class="meter"><div class="meter-fill" style="width:${(b.occupied/b.total)*100}%;background:${bedColor(b.occupied,b.total)}"></div></div>
          </div>`;
        }).join('')}
      </div>
      <div class="actions">
        <div class="faint mono" style="font-size:11.5px;">Queue: ${h.queue} · ~${h.avgWait} min wait</div>
        <button class="btn btn-primary btn-sm" onclick="reserveToken('${h.id}')" data-en="Reserve a token" data-hi="टोकन आरक्षित करें" data-mr="टोकन आरक्षित करा">Reserve a token</button>
        <a href="tel:${h.phone.replace(/\\s/g,'')}" class="btn btn-outline btn-sm">Call ${h.phone}</a>
      </div>
    </div>
  `).join('') || '<div class="card card-pad" data-en="No hospitals match those filters." data-hi="इन फ़िल्टरों से कोई अस्पताल मेल नहीं खाता।" data-mr="या फिल्टरशी जुळणारे रुग्णालय नाहीत.">No hospitals match those filters.</div>';
}

function reserveToken(id){
  const h = RS_HOSPITALS.find(x=>x.id===id);
  const token = h.queue + 1;
  h.queue += 1;
  rsToast('Token reserved', `You're #${token} in line at ${h.name}. Estimated call time ~${h.avgWait} min.`, 'ok');
  render();
}

['search','specFilter','statusFilter'].forEach(id => document.getElementById(id).addEventListener('input', render));
render();
</script>
</body>
</html>
