<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Availability — SwasthyaSetu</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:22px;}
  .toolbar input, .toolbar select{border:1px solid var(--border);border-radius:9px;padding:10px 14px;font-size:13.5px;font-family:var(--font-body);background:#fff;}
  .toolbar input{flex:1;min-width:220px;}
  .hlist{margin-top:22px;display:flex;flex-direction:column;gap:14px;}
  .hcard{padding:20px;display:grid;grid-template-columns:1.6fr 2fr auto;gap:22px;align-items:center;}
  .hcard h3{font-size:16.5px;}
  .hcard .meta{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .bedrow{display:flex;gap:18px;flex-wrap:wrap;}
  .bedmini{min-width:100px;}
  .bedmini .lbl{font-size:11px;color:var(--ink-faint);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.03em;}
  .bedmini .fig{font-family:var(--font-mono);font-size:13px;font-weight:600;margin-top:2px;}
  .hcard .meter{width:100%;margin-top:6px;}
  .actions{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:150px;}
  @media (max-width:920px){ .hcard{grid-template-columns:1fr;} }
</style>
</head>
<body><section class="section" style="padding-bottom:0;">
  <div class="container">
    <div class="eyebrow">Module 03</div>
    <h1 style="font-size:32px;margin-top:10px;">Hospital Availability</h1>
    <p class="muted mt-16" style="max-width:640px;font-size:15px;">Live bed counts and specialties across the network — sorted by distance from you, so you know before you travel.</p>

    <div class="toolbar">
      <input id="search" type="text" placeholder="Search hospital name or area…">
      <select id="specFilter">
        <option value="">All specialties</option>
        <option>Trauma</option><option>Cardiology</option><option>Neurology</option>
        <option>Orthopaedics</option><option>Paediatrics</option><option>Burns</option><option>General Surgery</option>
      </select>
      <select id="statusFilter">
        <option value="">Any availability</option>
        <option value="available">Beds available</option>
        <option value="busy">Limited beds</option>
      </select>
    </div>
  </div>
</section>

<section class="container mt-24" id="quickDemo"><div class="card card-pad"><div class="eyebrow">FAST ACCESS • DEMO</div><h3 style="margin-top:8px;">Quick demo hospitals — tap to view</h3><p class="faint mt-8">Simulated demo data — available without typing in search.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:16px;"><button class="card" type="button" style="text-align:left;padding:16px;cursor:pointer;border:1px solid var(--border);" onclick="document.getElementById('search').value='Sanjeevani General Hospital';render();window.scrollTo({top:document.querySelector('section.container').offsetTop,behavior:'smooth'})"><b>Sanjeevani General Hospital</b><div class="faint" style="font-size:12px;margin-top:5px;">Emergency • ICU • Trauma</div><div class="pill pill-ok" style="margin-top:10px;display:inline-flex;">2.1 km</div></button><button class="card" type="button" style="text-align:left;padding:16px;cursor:pointer;border:1px solid var(--border);" onclick="document.getElementById('search').value='Jamshedpur City Hospital';render();window.scrollTo({top:document.querySelector('section.container').offsetTop,behavior:'smooth'})"><b>Jamshedpur City Hospital</b><div class="faint" style="font-size:12px;margin-top:5px;">24×7 Emergency • Cardiology</div><div class="pill pill-ok" style="margin-top:10px;display:inline-flex;">3.4 km</div></button><button class="card" type="button" style="text-align:left;padding:16px;cursor:pointer;border:1px solid var(--border);" onclick="document.getElementById('search').value='Swasthya Care Centre';render();window.scrollTo({top:document.querySelector('section.container').offsetTop,behavior:'smooth'})"><b>Swasthya Care Centre</b><div class="faint" style="font-size:12px;margin-top:5px;">General • Paediatrics</div><div class="pill pill-ok" style="margin-top:10px;display:inline-flex;">4.0 km</div></button></div></div></section>
<section class="container">
  <div class="hlist" id="hlist"></div>
</section>

<script src="assets/shared.js"></script>
<script>
rsInitShell('hospitals.html');

function statusPill(h){
  if (h.status === 'full') return '<span class="pill pill-alert">Full — no beds</span>';
  if (h.status === 'busy') return '<span class="pill pill-warn">Limited beds</span>';
  return '<span class="pill pill-ok">Beds available</span>';
}
function bedColor(occ, total){
  const pct = occ/total;
  return pct >= .92 ? 'var(--alert)' : pct >= .75 ? 'var(--warning)' : 'var(--accent)';
}

function render(){
  const q = document.getElementById('search').value.toLowerCase();
  const spec = document.getElementById('specFilter').value;
  const stat = document.getElementById('statusFilter').value;

  const list = RS_HOSPITALS
    .filter(h => (h.name+h.area).toLowerCase().includes(q))
    .filter(h => !spec || h.specialties.includes(spec))
    .filter(h => !stat || h.status === stat || (stat==='available' && h.status==='available'))
    .sort((a,b)=>a.distanceKm-b.distanceKm);

  document.getElementById('hlist').innerHTML = list.map(h => `
    <div class="card hcard">
      <div>
        <h3>${h.name}</h3>
        <div class="meta">${h.area} · ${h.distanceKm} km away · ${h.level}</div>
        <div class="mt-8">${statusPill(h)}</div>
        <div class="tag-row mt-16">${h.specialties.map(s=>`<span class="badge-dept">${s}</span>`).join('')}</div>
      </div>
      <div class="bedrow">
        ${['general','icu','ventilator','pediatric'].map(k => {
          const b = h.beds[k]; const free = b.total-b.occupied;
          return `<div class="bedmini">
            <div class="lbl">${k==='icu'?'ICU':k==='pediatric'?'Paediatric':k.charAt(0).toUpperCase()+k.slice(1)}</div>
            <div class="fig">${free} / ${b.total} free</div>
            <div class="meter"><div class="meter-fill" style="width:${(b.occupied/b.total)*100}%;background:${bedColor(b.occupied,b.total)}"></div></div>
          </div>`;
        }).join('')}
      </div>
      <div class="actions">
        <div class="faint mono" style="font-size:11.5px;">Queue: ${h.queue} · ~${h.avgWait} min wait</div>
        <button class="btn btn-primary btn-sm" onclick="reserveToken('${h.id}')">Reserve a token</button>
        <a href="tel:${h.phone.replace(/\\s/g,'')}" class="btn btn-outline btn-sm">Call ${h.phone}</a>
      </div>
    </div>
  `).join('') || '<div class="card card-pad">No hospitals match those filters.</div>';
}

function reserveToken(id){
  const h = RS_HOSPITALS.find(x=>x.id===id);
  const token = h.queue + 1;
  h.queue += 1;
  rsToast('Token reserved', `You're #${token} in line at ${h.name}. Estimated call time ~${h.avgWait} min.`, 'ok');
  render();
}

['search','specFilter','statusFilter'].forEach(id => document.getElementById(id).addEventListener('input', render));
render();
</script>
</body>
</html>
