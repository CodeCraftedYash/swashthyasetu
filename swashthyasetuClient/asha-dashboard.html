<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-en="SwasthyaSetu" data-hi="SwasthyaSetu" data-mr="SwasthyaSetu">SwasthyaSetu</title><link rel="stylesheet" href="assets/styles.css"></head><body><script src="assets/shared.js"></script><script src="assets/api.js"></script><script>ssPage('asha-dashboard.html', `<div class="page-head"><div><h1 data-en="ASHA & Frontline Dashboard" data-hi="ASHA और फ्रंटलाइन डैशबोर्ड" data-mr="आशा व फ्रंटलाइन डॅशबोर्ड">ASHA & Frontline Dashboard</h1><p data-en="Prioritise households and complete follow-ups" data-hi="घरों को प्राथमिकता दें और फॉलो-अप पूरा करें" data-mr="घरांना प्राधान्य द्या आणि फॉलो-अप पूर्ण करा">Prioritise households and complete follow-ups</p></div><span class="badge">● <span data-en="Live Demo" data-hi="लाइव डेमो" data-mr="लाइव्ह डेमो">Live Demo</span></span></div><section class="metrics"><div class="metric"><div class="metric-icon">♟</div><div><b id="taskCount">—</b><span data-en="Pending tasks" data-hi="लंबित कार्य" data-mr="प्रलंबित कार्ये">Pending tasks</span></div></div><div class="metric blue"><div class="metric-icon">⌂</div><div><b>3</b><span data-en="High-priority households" data-hi="उच्च प्राथमिकता घर" data-mr="उच्च-प्राधान्य घरे">High-priority households</span></div></div><div class="metric green"><div class="metric-icon">↻</div><div><b data-en="Offline" data-hi="ऑफ़लाइन" data-mr="ऑफलाइन">Offline</b><span data-en="Queue supported" data-hi="क्यू समर्थित" data-mr="रांग समर्थित">Queue supported</span></div></div><div class="metric purple"><div class="metric-icon">✓</div><div><b data-en="Today" data-hi="आज" data-mr="आज">Today</b><span data-en="Priority route" data-hi="प्राथमिक मार्ग" data-mr="प्राधान्य मार्ग">Priority route</span></div></div></section><div class="grid-2"><div class="panel"><div class="panel-head"><h3 data-en="Today's worklist" data-hi="आज की कार्यसूची" data-mr="आजची कार्यसूची">Today's worklist</h3></div><div id="taskList"></div></div><div class="panel"><div class="panel-head"><h3 data-en="Add follow-up task" data-hi="फॉलो-अप कार्य जोड़ें" data-mr="फॉलो-अप कार्य जोडा">Add follow-up task</h3></div><form id="taskForm" class="panel-pad form-grid"><div class="field"><label data-en="Patient / मरीज" data-hi="मरीज" data-mr="रुग्ण">Patient / मरीज</label><input id="tPatient" required></div><div class="field"><label data-en="Village / गांव" data-hi="गांव" data-mr="गाव">Village / गांव</label><input id="tVillage"></div><div class="field"><label data-en="Priority / प्राथमिकता" data-hi="प्राथमिकता" data-mr="प्राधान्य">Priority / प्राथमिकता</label><select id="tPriority"><option value="High" data-en="High" data-hi="उच्च" data-mr="उच्च">High</option><option selected value="Medium" data-en="Medium" data-hi="मध्यम" data-mr="मध्यम">Medium</option><option value="Low" data-en="Low" data-hi="कम" data-mr="कमी">Low</option></select></div><div class="field"><label data-en="Reason / कारण" data-hi="कारण" data-mr="कारण">Reason / कारण</label><input id="tReason" required></div><div class="field full"><button class="btn" data-en="Add task / कार्य जोड़ें" data-hi="कार्य जोड़ें" data-mr="कार्य जोडा">Add task / कार्य जोड़ें</button></div></form></div></div>`);</script><script>async function loadTasks(){const ts=await SS_API.get('/asha/tasks');taskCount.textContent=ts.filter(t=>t.status==='pending').length;taskList.innerHTML=ts.map(t=>`<div class="list-row"><div class="avatar">♟</div><div><b>${ssEsc(t.patient)}</b><small>${ssEsc(t.village)} · ${ssEsc(t.reason)}</small></div><span class="right pill ${t.priority==='High'?'high':t.priority==='Medium'?'medium':'low'}">${ssEsc(t.priority)}</span></div>`).join('')||'<div class="panel-pad" data-en="No pending tasks." data-hi="कोई लंबित कार्य नहीं।" data-mr="कोणतीही प्रलंबित कामे नाहीत.">No pending tasks.</div>'}taskForm.addEventListener('submit',async e=>{e.preventDefault();try{await SS_API.post('/asha/tasks',{patient:tPatient.value,village:tVillage.value,priority:tPriority.value,reason:tReason.value});taskForm.reset();loadTasks();ssToast('Task saved to backend')}catch(e){ssToast(e.message)}});loadTasks().catch(e=>ssToast('Backend not available'))</script></body></html>
