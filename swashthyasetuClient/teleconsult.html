<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-en="SwasthyaSetu" data-hi="SwasthyaSetu" data-mr="SwasthyaSetu">SwasthyaSetu</title><link rel="stylesheet" href="assets/styles.css"></head><body><script src="assets/shared.js"></script><script src="assets/api.js"></script><script>ssPage('teleconsult.html', `<div class="page-head"><div><h1 data-en="Teleconsultation" data-hi="टेलीकंसल्टेशन" data-mr="टेलीकन्सल्टेशन">Teleconsultation</h1><p data-en="Request a remote consultation with care continuity" data-hi="देखभाल निरंतरता के साथ दूरस्थ परामर्श का अनुरोध करें" data-mr="काळजी सातत्यासह दूरस्थ सल्ला विनंती करा">Request a remote consultation with care continuity</p></div><span class="badge">● <span data-en="Live Demo" data-hi="लाइव डेमो" data-mr="लाइव्ह डेमो">Live Demo</span></span></div><div class="grid-2"><div class="panel"><div class="panel-head"><h3 data-en="Request consultation" data-hi="परामर्श अनुरोध" data-mr="सल्ला विनंती करा">Request consultation</h3></div><form id="consultForm" class="panel-pad form-grid"><div class="field"><label data-en="Patient / मरीज" data-hi="मरीज" data-mr="रुग्ण">Patient / मरीज</label><input id="cPatient" required></div><div class="field"><label data-en="Village / गांव" data-hi="गांव" data-mr="गाव">Village / गांव</label><input id="cVillage"></div><div class="field"><label data-en="Specialty / विशेषज्ञता" data-hi="विशेषज्ञता" data-mr="तज्ज्ञता">Specialty / विशेषज्ञता</label><select id="cSpecialty"><option value="General Medicine" data-en="General Medicine" data-hi="सामान्य चिकित्सा" data-mr="सामान्य वैद्यक">General Medicine</option><option value="Maternal Health" data-en="Maternal Health" data-hi="मातृ स्वास्थ्य" data-mr="माता आरोग्य">Maternal Health</option><option value="Child Health" data-en="Child Health" data-hi="बाल स्वास्थ्य" data-mr="बाल आरोग्य">Child Health</option><option value="Chronic Care" data-en="Chronic Care" data-hi="दीर्घकालिक देखभाल" data-mr="दीर्घकालीन काळजी">Chronic Care</option></select></div><div class="field"><label data-en="Preferred mode / तरीका" data-hi="पसंदीदा तरीका" data-mr="पसंतीचा प्रकार">Preferred mode / तरीका</label><select id="cMode"><option value="Video" data-en="Video" data-hi="वीडियो" data-mr="व्हिडिओ">Video</option><option value="Audio" data-en="Audio" data-hi="ऑडियो" data-mr="ऑडिओ">Audio</option><option value="ASHA-assisted" data-en="ASHA-assisted" data-hi="आशा-सहायता प्राप्त" data-mr="आशा-सहाय्यित">ASHA-assisted</option></select></div><div class="field full"><label data-en="Summary / सारांश" data-hi="सारांश" data-mr="सारांश">Summary / सारांश</label><textarea id="cSummary" required></textarea></div><div class="field full"><button class="btn" data-en="Request teleconsult / अनुरोध भेजें" data-hi="टेली-कंसल्ट का अनुरोध भेजें" data-mr="टेली-कन्सल्ट विनंती पाठवा">Request teleconsult / अनुरोध भेजें</button></div></form></div><div class="panel"><div class="panel-head"><h3 data-en="Video / Audio Consultation Demo" data-hi="वीडियो / ऑडियो परामर्श डेमो" data-mr="व्हिडिओ / ऑडिओ सल्ला डेमो">Video / Audio Consultation Demo</h3></div><div class="panel-pad"><video id="localVideo" autoplay muted playsinline style="width:100%;border-radius:14px;background:#111;min-height:180px"></video><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn red" id="startVideo" data-en="🎥 Start Video Call" data-hi="🎥 वीडियो कॉल शुरू करें" data-mr="🎥 व्हिडिओ कॉल सुरू करा">🎥 Start Video Call</button><a class="btn outline" href="tel:+911234567890" data-en="📞 Call Doctor" data-hi="📞 डॉक्टर को कॉल करें" data-mr="📞 डॉक्टरांना कॉल करा">📞 Call Doctor</a><button class="btn outline" id="stopVideo" data-en="End Call" data-hi="कॉल समाप्त करें" data-mr="कॉल संपवा">End Call</button></div><small id="callStatus" style="display:block;margin-top:8px;color:var(--muted)" data-en="Demo mode: camera preview only; production version can connect two users with WebRTC." data-hi="डेमो मोड: केवल कैमरा प्रीव्यू; असली संस्करण WebRTC से दो उपयोगकर्ताओं को जोड़ सकता है।" data-mr="डेमो मोड: फक्त कॅमेरा पूर्वावलोकन; प्रत्यक्ष आवृत्ती WebRTC ने दोन वापरकर्ते जोडू शकते.">Demo mode: camera preview only; production version can connect two users with WebRTC.</small></div></div><div class="panel"><div class="panel-head"><h3 data-en="Safe prototype scope" data-hi="सुरक्षित प्रोटोटाइप सीमा" data-mr="सुरक्षित प्रोटोटाइप व्याप्ती">Safe prototype scope</h3></div><div class="panel-pad"><ul style="line-height:2;color:var(--muted)"><li data-en="Supports appointment and consultation workflow" data-hi="अपॉइंटमेंट और परामर्श कार्यप्रवाह समर्थित" data-mr="भेट व सल्ला कार्यप्रवाहाला समर्थन देते">Supports appointment and consultation workflow</li><li data-en="Does not claim to diagnose automatically" data-hi="स्वचालित निदान का दावा नहीं करता" data-mr="आपोआप निदान करण्याचा दावा करत नाही">Does not claim to diagnose automatically</li><li data-en="Consultation request stays linked to the care journey" data-hi="परामर्श अनुरोध देखभाल यात्रा से जुड़ा रहता है" data-mr="सल्ला विनंती काळजी प्रवासाशी जोडलेली राहते">Consultation request stays linked to the care journey</li></ul></div></div></div><div class="panel" style="margin-top:18px"><div class="panel-head"><h3 data-en="Consultation requests" data-hi="परामर्श अनुरोध" data-mr="सल्ला विनंत्या">Consultation requests</h3></div><div id="consultList" class="table-wrap"></div></div>`);</script><script>async function loadConsult(){const cs=await SS_API.get('/consultations');consultList.innerHTML=`<table class="table"><thead><tr><th data-en="Patient" data-hi="मरीज" data-mr="रुग्ण">Patient</th><th data-en="Specialty" data-hi="विशेषज्ञता" data-mr="तज्ज्ञता">Specialty</th><th data-en="Mode" data-hi="तरीका" data-mr="पद्धत">Mode</th><th data-en="Status" data-hi="स्थिति" data-mr="स्थिती">Status</th></tr></thead><tbody>${cs.map(c=>`<tr><td>${ssEsc(c.patient)}</td><td>${ssEsc(c.specialty)}</td><td>${ssEsc(c.mode)}</td><td><span class="pill info">${ssEsc(c.status)}</span></td></tr>`).join('')||'<tr><td colspan="4" data-en="No requests yet." data-hi="अभी कोई अनुरोध नहीं।" data-mr="अद्याप कोणतीही विनंती नाही.">No requests yet.</td></tr>'}</tbody></table>`}consultForm.addEventListener('submit',async e=>{e.preventDefault();try{await SS_API.post('/consultations',{patient:cPatient.value,village:cVillage.value,specialty:cSpecialty.value,mode:cMode.value,summary:cSummary.value});consultForm.reset();loadConsult();ssToast('Consultation request saved')}catch(e){ssToast(e.message)}});loadConsult().catch(e=>ssToast('Backend not available'))</script></body></html><script>
let stream=null; startVideo.onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});localVideo.srcObject=stream;callStatus.textContent='Video call demo started. Camera and microphone are active on this device.'}catch(e){callStatus.textContent='Camera/microphone permission was not granted. You can still use the audio-call demo.'}};stopVideo.onclick=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());localVideo.srcObject=null;callStatus.textContent='Call ended.'};
</script>
