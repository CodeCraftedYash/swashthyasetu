<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SwasthyaSetu</title><link rel="stylesheet" href="assets/styles.css"></head><body><script src="assets/shared.js"></script><script src="assets/api.js"></script><script>ssPage('teleconsult.html', `<div class="page-head"><div><h1 data-en="Teleconsultation" data-hi="टेलीकंसल्टेशन">Teleconsultation</h1><p data-en="Request a remote consultation with care continuity" data-hi="देखभाल निरंतरता के साथ दूरस्थ परामर्श का अनुरोध करें">Request a remote consultation with care continuity</p></div><span class="badge">● <span data-en="Live Demo" data-hi="लाइव डेमो">Live Demo</span></span></div><div class="grid-2"><div class="panel"><div class="panel-head"><h3 data-en="Request consultation" data-hi="परामर्श अनुरोध">Request consultation</h3></div><form id="consultForm" class="panel-pad form-grid"><div class="field"><label>Patient / मरीज</label><input id="cPatient" required></div><div class="field"><label>Village / गांव</label><input id="cVillage"></div><div class="field"><label>Specialty / विशेषज्ञता</label><select id="cSpecialty"><option>General Medicine</option><option>Maternal Health</option><option>Child Health</option><option>Chronic Care</option></select></div><div class="field"><label>Preferred mode / तरीका</label><select id="cMode"><option>Video</option><option>Audio</option><option>ASHA-assisted</option></select></div><div class="field full"><label>Summary / सारांश</label><textarea id="cSummary" required></textarea></div><div class="field full"><button class="btn">Request teleconsult / अनुरोध भेजें</button></div></form></div><div class="panel"><div class="panel-head"><h3>Video / Audio Consultation Demo</h3></div><div class="panel-pad"><video id="localVideo" autoplay muted playsinline style="width:100%;border-radius:14px;background:#111;min-height:180px"></video><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn red" id="startVideo">🎥 Start Video Call</button><a class="btn outline" href="tel:+911234567890">📞 Call Doctor</a><button class="btn outline" id="stopVideo">End Call</button></div><small id="callStatus" style="display:block;margin-top:8px;color:var(--muted)">Demo mode: camera preview only; production version can connect two users with WebRTC.</small></div></div><div class="panel"><div class="panel-head"><h3 data-en="Safe prototype scope" data-hi="सुरक्षित प्रोटोटाइप सीमा">Safe prototype scope</h3></div><div class="panel-pad"><ul style="line-height:2;color:var(--muted)"><li data-en="Supports appointment and consultation workflow" data-hi="अपॉइंटमेंट और परामर्श कार्यप्रवाह समर्थित">Supports appointment and consultation workflow</li><li data-en="Does not claim to diagnose automatically" data-hi="स्वचालित निदान का दावा नहीं करता">Does not claim to diagnose automatically</li><li data-en="Consultation request stays linked to the care journey" data-hi="परामर्श अनुरोध देखभाल यात्रा से जुड़ा रहता है">Consultation request stays linked to the care journey</li></ul></div></div></div><div class="panel" style="margin-top:18px"><div class="panel-head"><h3 data-en="Consultation requests" data-hi="परामर्श अनुरोध">Consultation requests</h3></div><div id="consultList" class="table-wrap"></div></div>`);</script><script>async function loadConsult(){const cs=await SS_API.get('/consultations');consultList.innerHTML=`<table class="table"><thead><tr><th>Patient</th><th>Specialty</th><th>Mode</th><th>Status</th></tr></thead><tbody>${cs.map(c=>`<tr><td>${ssEsc(c.patient)}</td><td>${ssEsc(c.specialty)}</td><td>${ssEsc(c.mode)}</td><td><span class="pill info">${ssEsc(c.status)}</span></td></tr>`).join('')||'<tr><td colspan="4">No requests yet.</td></tr>'}</tbody></table>`}consultForm.addEventListener('submit',async e=>{e.preventDefault();try{await SS_API.post('/consultations',{patient:cPatient.value,village:cVillage.value,specialty:cSpecialty.value,mode:cMode.value,summary:cSummary.value});consultForm.reset();loadConsult();ssToast('Consultation request saved')}catch(e){ssToast(e.message)}});loadConsult().catch(e=>ssToast('Backend not available'))</script></body></html><script>
let stream=null; startVideo.onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});localVideo.srcObject=stream;callStatus.textContent='Video call demo started. Camera and microphone are active on this device.'}catch(e){callStatus.textContent='Camera/microphone permission was not granted. You can still use the audio-call demo.'}};stopVideo.onclick=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());localVideo.srcObject=null;callStatus.textContent='Call ended.'};
</script>
